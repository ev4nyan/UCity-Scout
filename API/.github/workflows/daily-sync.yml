# This is the magic recipe for our GitHub robot! Hmph.
name: Daily UCity Scout Data Sync

# This tells the robot WHEN to wake up and do its job.
on:
  workflow_dispatch: # This lets you run it manually from GitHub, just for testing! So smart!
  schedule:
    # This is a cron job! It means "run at 3:00 AM UTC every single day."
    # So our data is always fresh when you wake up!
    - cron: '0 3 * * *'

jobs:
  sync-data:
    # The robot will run on a standard Linux computer.
    runs-on: ubuntu-latest

    steps:
    # Step 1: The robot gets a copy of our latest code.
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: It sets up the Python environment.
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # Use the same version you have!

    # Step 3: It installs all the tools from our shopping list!
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Run each ETL in dependency order, then build the aggregated intelligence table.
    - name: Sync Properties
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python API/DATA/etl/properties/etl_properties.py

    - name: Sync Violations
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python API/DATA/etl/violations/etl_violations.py

    - name: Sync Permits
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python API/DATA/etl/permits/etl_permits.py

    - name: Sync Rental Licenses
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python API/DATA/etl/licenses/etl_licenses.py

    - name: Sync Tax Delinquencies
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python API/DATA/etl/tax/etl_tax.py

    - name: Sync Crime Incidents
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python API/DATA/etl/crime/etl_crime.py

    - name: Build Property Intelligence
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python API/DATA/etl/property_intelligence/etl_property_intelligence.py
